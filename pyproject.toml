[project]
name = "amplifier-module-context-memory"
version = "0.1.0"
description = "Amplifier context module that injects relevant memories at session start"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "amplifier-core>=0.1.0",
    "amplifier-module-tool-memory>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.entry-points."amplifier.modules"]
context-memory = "amplifier_module_context_memory:mount"

[tool.uv.sources]
amplifier-core = { git = "https://github.com/microsoft/amplifier-core", branch = "main" }
amplifier-module-tool-memory = { git = "https://github.com/michaeljabbour/amplifier-module-tool-memory", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_context_memory"]
